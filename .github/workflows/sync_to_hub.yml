name: Sync to Hugging Face hub
on:
  push:
    branches: [main, pilot]
  workflow_dispatch:
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push main to production Space
        if: github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://yuriiilnytskyi:$HF_TOKEN@huggingface.co/spaces/yuriiilnytskyi/lm-playschool main
      - name: Push pilot to pilot Space
        if: github.ref == 'refs/heads/pilot'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://yuriiilnytskyi:$HF_TOKEN@huggingface.co/spaces/yuriiilnytskyi/lm-playschool-pilot pilot:main
